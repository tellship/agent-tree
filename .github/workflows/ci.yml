name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test tests/tree.spec.ts
      - name: Install Claude Code (for `claude plugin validate`)
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - run: claude plugin validate .
